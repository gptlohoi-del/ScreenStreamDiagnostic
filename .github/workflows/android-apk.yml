name: Build RTSP Diagnostic APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read app version and validate tag
        shell: bash
        run: |
          VERSION=$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then echo 'Cannot read versionName'; exit 1; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ "${GITHUB_REF#refs/tags/}" != "v${VERSION}" ]]; then
            echo "Git tag must match app version: v${VERSION}"; exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: JVM RTSP smoke test
        run: bash tools/rtsp-smoke.sh

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload versioned debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RTSPDiagnostic-v${{ env.APP_VERSION }}-debug
          path: app/build/outputs/apk/debug/RTSPDiagnostic-v${{ env.APP_VERSION }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Optional stable release signing. Add the 4 repository secrets listed in README.
      - name: Prepare optional signing key
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/rtsp-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/rtsp-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK if configured
        if: ${{ env.SIGNING_AVAILABLE == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload signed release APK
        if: ${{ env.SIGNING_AVAILABLE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: RTSPDiagnostic-v${{ env.APP_VERSION }}-release
          path: app/build/outputs/apk/release/RTSPDiagnostic-v${{ env.APP_VERSION }}-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish tagged APK to GitHub Releases
        if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v2
        with:
          name: RTSP Diagnostic ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/debug/RTSPDiagnostic-v${{ env.APP_VERSION }}-debug.apk
            app/build/outputs/apk/release/RTSPDiagnostic-v${{ env.APP_VERSION }}-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
